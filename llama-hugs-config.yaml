# llama-hugs-config.yaml — wimpy
# Canonical source for /etc/llama-hugs/config.yaml (deployed via
# /usr/local/sbin/llama-hugs-deploy + /opt/llama-hugs/gen-config.py).
# Rebuilt 2026-09-23 from the live config after 6c36e1e accidentally gutted
# the models section (98 -> 2). All amd-r9700 members now carry --no-mmap
# (ROCm mmap load hang under host memory pressure, proven 2026-09-23).
#
# HARDWARE: DUAL-GPU — see groups below.
#   - AMD R9700 32GB (ROCm/HIP gfx1201) — primary, group amd-r9700.
#   - RTX 5060 Ti 16GB (CUDA sm_120) — group nvidia-5060ti, the -cuda entries.
#   - Ryzen 7700 Raphael iGPU also enumerates as ROCm — R9700 pinned by UUID.
# BINARY: /usr/local/bin/llama-server (ROCm) | /opt/llama-cuda/bin/llama-server (CUDA).
#   Never a bare `llama-server` (PATH resolution caused silent CPU fallback).
# GPU PIN: HIP_VISIBLE_DEVICES=GPU-61fe9ba05af1939a (R9700 by stable UUID);
#   CUDA_VISIBLE_DEVICES=0 (5060 Ti). Both add --device as a hard-fail guard
#   against silent CPU fallback.
# --no-mmap: REQUIRED on all ROCm members — the mmap load path wedges (~98%
#   CPU spin at load_model, /health never answers) under host memory pressure.
#   Proven 2026-09-23: identical cmd + --no-mmap loads in 10.8s.
#
