    env: ["CUDA_VISIBLE_DEVICES=0"]
    # Switched from Q8_0 (~15GB) to Q4_K_M (~8GB) — Q8_0 OOMed at 64K on 16GB.
    cmd: >
      llama-server
        --model /home/rahlquist/.cache/llama.cpp/phi-4-Q4_K_M.gguf
