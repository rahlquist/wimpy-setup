# llama-swap-config.yaml — wimpy
# Copy to /etc/llama-swap/config.yaml, then restart the service:
#   [ -f /etc/llama-swap/config.yaml ] && sudo cp /etc/llama-swap/config.yaml /etc/llama-swap/$(date +%Y%m%d%H%M%S)-config.yaml.bak
#   sudo cp llama-swap-config.yaml /etc/llama-swap/config.yaml
#   sudo systemctl restart llama-swap
#
# ─────────────────────────────────────────────────────────────────────────────
# HARDWARE: AMD Radeon AI PRO R9700 32GB (ROCm/HIP) + GT 710 (display only,
#           excluded — driven by nouveau, no ROCm/CUDA device at all so no
#           pinning is even possible for it).
#           RTX 5060 Ti is temporarily removed pending re-install; this config
#           targets the R9700 only until that happens.
# BINARY  : /usr/local/bin/llama-server — built from source via 05-llama-cpp.sh
#           (ROCm/HIP, gfx1201, floats to latest master on each rebuild —
#           re-run GPU validation after rebuilding). This replaced the
#           llama-cpp-rocm/ggml-rocm pacman
#           packages as the single source of truth; if /usr/bin/llama-server
#           still exists, that's the OLD package build — do not point
#           anything at it, and remove the packages once this build is
#           verified working (see CHANGELOG.md). Do NOT use a bare
#           `llama-server` here either — PATH-resolving to whichever build
#           happens to be first on $PATH is exactly what caused silent CPU
#           fallback during the original CUDA->ROCm migration. Always use
#           the explicit path.
# GPU PIN : HIP_VISIBLE_DEVICES=0 selects the one ROCm-visible device (the
#           R9700). Kept explicit even with a single GPU so the pinning
#           pattern is future-proofed against ever adding a second AMD GPU.
# CONTEXT : 65536 everywhere — Hermes Agent requires a 64K minimum. fetch-model
#           inspects the downloaded GGUF's native context first; a larger native
#           limit is recorded in the inventory but is not enabled automatically.
# KV CACHE: flash attention + Q4 quantized KV (-fa on, ctk/ctv q4_0) keeps the
#           64K KV cache small enough to fit alongside weights.
# BINDING : --host 0.0.0.0 so hermesvm01 can reach models over the br0 bridge.
# ─────────────────────────────────────────────────────────────────────────────
#
# ONE consistent method: every model uses --model with an explicit path to the
# file that download-models.sh saved into $MODELS. This matches the slug setup
# and avoids any double-download. If your cache dir differs, edit MODELS-equiv
# paths below (they assume the default ~/.cache/llama.cpp for user rahlquist).
#
# MoE entries add: -ngl 99 --n-cpu-moe N  (keep the expert tensors for the first
# N transformer blocks in system RAM). N is hardware- and context-dependent:
# fetch-model requires an explicit value and validates it against GGUF metadata.
# Lower it only after checking `rocm-smi` headroom; then re-smoke-test.

healthCheckTimeout: 180

models:
  "ornith-1-0-35b-ud-q4-k-xl":
    ttl: 300
    env: ["HIP_VISIBLE_DEVICES=0"]
    cmd: |
