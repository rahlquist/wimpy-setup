# llama-swap-config.yaml — wimpy
# Copy to /etc/llama-swap/config.yaml, then restart the service:
#   [ -f /etc/llama-swap/config.yaml ] && sudo cp /etc/llama-swap/config.yaml /etc/llama-swap/$(date +%Y%m%d%H%M%S)-config.yaml.bak
#   sudo cp llama-swap-config.yaml /etc/llama-swap/config.yaml
#   sudo systemctl restart llama-swap
#
# ─────────────────────────────────────────────────────────────────────────────
# HARDWARE: RTX 5060 Ti 16GB (GPU 0) + GT 710 (GPU 1, display only, excluded)
# CONTEXT : 65536 everywhere — Hermes Agent requires a 64K minimum.
# KV CACHE: flash attention + Q4 quantized KV (-fa on, ctk/ctv q4_0) keeps the
#           64K KV cache small enough to fit alongside weights on 16GB.
# BINDING : --host 0.0.0.0 so hermesvm01 can reach models over the br0 bridge.
# ─────────────────────────────────────────────────────────────────────────────
#
# ONE consistent method: every model uses --model with an explicit path to the
# file that download-models.sh saved into $MODELS. This matches the slug setup
# and avoids any double-download. If your cache dir differs, edit MODELS-equiv
# paths below (they assume the default ~/.cache/llama.cpp for user rahlquist).
#
# MoE entries add: -ngl 99 --n-cpu-moe N  (offload N layers' experts to 64GB RAM).
# Start N conservative; lower it to push experts onto the GPU for speed while
# watching `nvidia-smi`. --n-cpu-moe counts from the highest-numbered layers down.

healthCheckTimeout: 180

models:

  # ══════════════════════════════════════════════════════════════════════════
  #  TIER 1 — fits comfortably at 64K on 16GB
  # ══════════════════════════════════════════════════════════════════════════

  qwen2.5-coder-14b:
    ttl: 300
    env: ["CUDA_VISIBLE_DEVICES=0"]
    cmd: >
      llama-server
        --model /home/rahlquist/.cache/llama.cpp/Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
        --ctx-size 65536 --n-gpu-layers 99
        --flash-attn on --cache-type-k q4_0 --cache-type-v q4_0
        --host 0.0.0.0 --port ${PORT} --jinja --metrics

  mistral-7b:
    ttl: 300
    env: ["CUDA_VISIBLE_DEVICES=0"]
    cmd: >
      llama-server
        --model /home/rahlquist/.cache/llama.cpp/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
        --ctx-size 65536 --n-gpu-layers 99
        --flash-attn on --cache-type-k q4_0 --cache-type-v q4_0
        --host 0.0.0.0 --port ${PORT} --jinja --metrics

  llama3.2-3b:
