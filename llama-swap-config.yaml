# llama-swap-config.yaml — wimpy
# Copy to /etc/llama-swap/config.yaml, then restart the service:
#   [ -f /etc/llama-swap/config.yaml ] && sudo cp /etc/llama-swap/config.yaml /etc/llama-swap/$(date +%Y%m%d%H%M%S)-config.yaml.bak
#   sudo cp llama-swap-config.yaml /etc/llama-swap/config.yaml
#   sudo systemctl restart llama-swap
#
# ─────────────────────────────────────────────────────────────────────────────
# HARDWARE: DUAL-GPU, both used for inference (see the `groups:` block below).
#           - AMD R9700 32GB (ROCm/HIP gfx1201) — primary, group `amd-r9700`.
#           - RTX 5060 Ti 16GB (NVIDIA/CUDA sm_120) — group `nvidia-5060ti`, the
#             `-cuda` model entries. Reinstalled in the 2026-07-23 platform swap
#             (ASRock X870 / Ryzen 7 7700 / 32GB DDR5).
#           - Ryzen 7700 Raphael iGPU (gfx1036) — ALSO enumerates as a ROCm
#             device, so the R9700 is pinned by UUID (see GPU PIN below).
#           The two groups are exclusive:false, so one model per GPU can be
#           resident at once and the cards serve concurrently. NOTE: RAM is 32GB
#           (was 64GB) — MoE --n-cpu-moe is now 0 (all experts fit on the 32GB
#           R9700); re-smoke-test if you change it.
# BINARY  : TWO builds, isolated by prefix (they share libggml filenames):
#           - /usr/local/bin/llama-server — ROCm/HIP (05-llama-cpp.sh), R9700.
#           - /opt/llama-cuda/bin/llama-server — CUDA (06-llama-cpp-cuda.sh),
#             5060 Ti. Both float to latest master on rebuild; re-run GPU
#             validation after. If /usr/bin/llama-server exists it's the OLD
#             pacman build — never point at it. Do NOT use a bare `llama-server`
#             (PATH resolution to whichever build is first is what caused silent
#             CPU fallback in the original migration). Always the explicit path.
# GPU PIN : HIP_VISIBLE_DEVICES=GPU-61fe9ba05af1939a pins to the R9700 by its
#           stable UUID (not index). As of the 2026-07-23 platform swap the
#           Ryzen 7700's Raphael iGPU (gfx1036) also enumerates as a ROCm device
#           (it was ROCm1 next to the R9700 at ROCm0), so an index-based pin like
#           "HIP_VISIBLE_DEVICES=0" is fragile — a BIOS/kernel reorder could point
#           it at the tiny iGPU and silently tank inference. The UUID always
#           resolves to the R9700 and remaps it to ROCm0, so `--device ROCm0`
#           stays correct. (Get the UUID from `rocminfo`.) The RTX 5060 Ti is
#           invisible to THIS HIP build — it's driven separately by the `-cuda`
#           entries via the CUDA build with CUDA_VISIBLE_DEVICES=0 + --device CUDA0.
# CONTEXT : 65536 everywhere — Hermes Agent requires a 64K minimum. fetch-model
#           inspects the downloaded GGUF's native context first; a larger native
#           limit is recorded in the inventory but is not enabled automatically.
# KV CACHE: flash attention + Q4 quantized KV (-fa on, ctk/ctv q4_0) keeps the
#           64K KV cache small enough to fit alongside weights.
# BINDING : --host 0.0.0.0 so hermesvm01 can reach models over the br0 bridge.
# ─────────────────────────────────────────────────────────────────────────────
#
# ONE consistent method: every model uses --model with an explicit path to the
# file that fetch-model.sh saved into $MODELS. This matches the slug setup
# and avoids any double-download. If your cache dir differs, edit MODELS-equiv
# paths below (they assume the default ~/.cache/llama.cpp for user rahlquist).
#
# MoE entries add: -ngl 99 --n-cpu-moe N  (keep the expert tensors for the first
# N transformer blocks in system RAM). N is hardware- and context-dependent:
# fetch-model requires an explicit value and validates it against GGUF metadata.
# Lower it only after checking `rocm-smi` headroom; then re-smoke-test.

healthCheckTimeout: 180

# ── Dual-GPU groups (added 2026-07-24) ───────────────────────────────────────
# Two GPUs, one llama-swap. Without groups, only ONE model stays resident at a
# time; that would stop the R9700 and the RTX 5060 Ti from serving in parallel.
# Per-group `swap: true` keeps each GPU to one model at a time (a GPU can't run
# two at once anyway). Per-group `exclusive: false` means loading a model in one
# group does NOT unload the other group — so an AMD model and an NVIDIA model can
# be resident at the same time and serve two agents concurrently, one per GPU.
#
# EVERY model must be listed in a group. A model left out falls into the default
# exclusive group, which would evict the other group and break concurrency — so
# when you add a model, also add its id here (ROCm0 -> amd-r9700, CUDA0 ->
# nvidia-5060ti). The CUDA entries need /opt/llama-cuda/bin/llama-server, built
# by 06-llama-cpp-cuda.sh.
groups:
  amd-r9700:
    swap: true          # one model at a time on the single R9700
    exclusive: false    # do NOT unload the nvidia group when an AMD model loads
    members:
      - "ornith-1-0-35b-ud-q4-k-xl"
      - "qwen3-30b-a3b-instruct-2507-ud-q5-k-xl"
      - "qwen-qwen3-30b-a3b-instruct-2507-q6-k-l"
      - "qwen-qwen3-30b-a3b-instruct-2507-q5-k-m"
      - "qwen3-coder-30b-a3b-instruct-q5-k-m"
      - "deepseek-coder-v2-lite-instruct-q4-k-m"
      - "ornith-1-0-9b-q8-0"
      - "gemma4-coding-q6-k"
      - "qwen2.5-coder-14b"
      - "mistral-7b"
      - "llama3.2-3b"
      - "granite-4.1-8b"
      - "granite-4.1-3b"
      - "phi-4"
      - "deepseek-r1-14b"
      - "gemma-3-12b"
      - "gemma-4-12b"
      - "llama-2-7b"
      - "qwen3.5-9b-q4"
      - "qwen3.5-9b-q6"
      - "qwen3.5-9b-q8"
      - "ling-mini-2-q4"
      - "ling-mini-2-q5"
      - "ling-mini-2-q6"
      - "qwen3-30b-a3b"
      - "gemma-4-26b-moe"

  nvidia-5060ti:
    swap: true          # one model at a time on the single 5060 Ti
    exclusive: false    # do NOT unload the amd group when a CUDA model loads
    members:
      - "qwen2.5-coder-14b-cuda"
      - "gemma-3-12b-cuda"
      - "qwen3.5-9b-q6-cuda"
      - "deepseek-coder-v2-lite-instruct-q4-k-m-cuda"
      - "ornith-1-0-9b-q8-0-cuda"
      - "gemma4-coding-q6-k-cuda"
      - "mistral-7b-cuda"
      - "llama3.2-3b-cuda"
      - "granite-4.1-8b-cuda"
      - "granite-4.1-3b-cuda"
      - "phi-4-cuda"
      - "deepseek-r1-14b-cuda"
      - "gemma-4-12b-cuda"
      - "llama-2-7b-cuda"
      - "qwen3.5-9b-q4-cuda"
      - "qwen3.5-9b-q8-cuda"
      - "ovisocr2-f16-cuda"
      - "ling-mini-2-q4-cuda"
      - "ling-mini-2-q5-cuda"
      - "ling-mini-2-q6-cuda"

