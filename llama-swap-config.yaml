  qwen3-30b-a3b:
    ttl: 300
    env: ["CUDA_VISIBLE_DEVICES=0"]
    # 30B MoE, 3B active. Start with high --n-cpu-moe; lower toward ~20 as VRAM
    # allows. Raised batch sizes help CPU+GPU MoE throughput.
    cmd: >
      llama-server
        --model /home/rahlquist/.cache/llama.cpp/Qwen3-30B-A3B-Q4_K_M.gguf
        --ctx-size 65536 --n-gpu-layers 99 --n-cpu-moe 36
