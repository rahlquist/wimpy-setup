<svg xmlns="http://www.w3.org/2000/svg" width="680" height="740" viewBox="0 0 680 740" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>wimpy host and hermesvm01 network topology</title>
<desc>OPNsense runs Unbound DNS and dnsmasq DHCP on the home.lan LAN. The wimpy host (Ryzen 7 7700 8c/8t, 32GB RAM, dual GPU: AMD R9700 32GB via ROCm/HIP + NVIDIA RTX 5060 Ti 16GB via CUDA) has enp10s0 enslaved into bridge br0 as wimpy.home.lan. Two llama.cpp builds (one ROCm, one CUDA) run under a single llama-swap on port 8080 with two groups, so a model on each GPU can serve concurrently. The hermesvm01 KVM guest connects through libvirt host-bridge to br0 as hermesvm01.home.lan and runs Hermes Agent against wimpy.home.lan:8080.</desc>
<style>
  .t  { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .bg { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #f3f1ea; }
  }
</style>
<rect class="bg" x="0" y="0" width="680" height="740"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- OPNsense -->
<rect x="200" y="24" width="280" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
<text class="t" x="340" y="48" text-anchor="middle" fill="#2C2C2A">OPNsense router</text>
<text class="ts" x="340" y="66" text-anchor="middle" fill="#5F5E5A">Unbound DNS · dnsmasq DHCP</text>

<text class="ts" x="340" y="100" text-anchor="middle" fill="#5F5E5A">home.lan LAN</text>
<line x1="340" y1="80" x2="340" y2="114" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Host container -->
<rect x="30" y="114" width="620" height="372" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="t" x="54" y="140" fill="#0C447C">wimpy host — bare metal · CachyOS</text>
<text class="ts" x="54" y="160" fill="#185FA5">Ryzen 7 7700 · 8c/8t · 32GB RAM · R9700 32GB (ROCm) + RTX 5060 Ti 16GB (CUDA)</text>

<!-- br0 -->
<rect x="56" y="180" width="248" height="84" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="t" x="180" y="206" text-anchor="middle" fill="#085041">br0 bridge</text>
<text class="ts" x="180" y="228" text-anchor="middle" fill="#0F6E56">wimpy.home.lan</text>
<text class="ts" x="180" y="246" text-anchor="middle" fill="#0F6E56">enp10s0 enslaved</text>

<!-- llama.cpp -->
<rect x="340" y="180" width="284" height="84" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="t" x="482" y="200" text-anchor="middle" fill="#27500A">llama.cpp — dual-GPU inference</text>
<text class="ts" x="482" y="220" text-anchor="middle" fill="#3B6D11">/usr/local · ROCm gfx1201 → R9700 32GB</text>
<text class="ts" x="482" y="238" text-anchor="middle" fill="#3B6D11">/opt/llama-cuda · sm_120 → 5060 Ti 16GB</text>

<text class="ts" x="482" y="280" text-anchor="middle" fill="#5F5E5A">loads via</text>
<line x1="482" y1="288" x2="482" y2="266" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- llama-swap -->
<rect x="340" y="288" width="284" height="184" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="t" x="482" y="310" text-anchor="middle" fill="#633806">llama-swap · port 8080</text>
<text class="ts" x="482" y="328" text-anchor="middle" fill="#854F0B">2 groups · R9700 ‖ 5060 Ti concurrent</text>
<text class="ts" x="356" y="350" fill="#633806">qwen2.5-coder-14b · qwen3-30b-a3b</text>
<text class="ts" x="356" y="366" fill="#633806">qwen3.5-9b q4/q6/q8 · phi-4</text>
<text class="ts" x="356" y="382" fill="#633806">deepseek-r1-14b · mistral-7b</text>
<text class="ts" x="356" y="398" fill="#633806">granite-4.1 8b/3b · llama3.2-3b</text>
<text class="ts" x="356" y="414" fill="#633806">gemma-3-12b · gemma-4-12b</text>
<text class="ts" x="356" y="430" fill="#633806">gemma-4-26b-moe · llama-2-7b</text>
<text class="ts" x="356" y="446" fill="#633806">ling-mini-2 q4/q5/q6</text>
<text class="ts" x="356" y="462" fill="#854F0B">R9700: 26 models · 5060 Ti: 19 · MoE all-GPU</text>

<!-- libvirt host-bridge -->
<rect x="56" y="288" width="248" height="184" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="t" x="80" y="312" fill="#26215C">libvirt host-bridge</text>
<text class="ts" x="80" y="332" fill="#534AB7">attaches to br0 — no NAT</text>
<text class="ts" x="80" y="350" fill="#534AB7">VMs join the LAN directly</text>
<rect x="74" y="368" width="212" height="40" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text class="ts" x="180" y="392" text-anchor="middle" fill="#72243E">hermesvm01 vNIC</text>

<text class="ts" x="244" y="226" text-anchor="middle" fill="#5F5E5A">serves :8080</text>
<line x1="304" y1="222" x2="338" y2="222" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="180" y1="472" x2="180" y2="528" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="244" y="504" text-anchor="middle" fill="#5F5E5A">over br0, no NAT</text>

<!-- hermesvm01 -->
<rect x="120" y="528" width="440" height="100" rx="14" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text class="t" x="340" y="554" text-anchor="middle" fill="#4B1528">hermesvm01 — KVM guest</text>
<text class="ts" x="340" y="574" text-anchor="middle" fill="#72243E">CachyOS + MATE · 4 vCPU · 16GB · 500GB</text>
<text class="ts" x="340" y="592" text-anchor="middle" fill="#72243E">hermesvm01.home.lan</text>
<text class="ts" x="340" y="612" text-anchor="middle" fill="#72243E">Hermes Agent → wimpy.home.lan:8080/v1</text>

<text class="ts" x="340" y="662" text-anchor="middle" fill="#5F5E5A">future VMs follow the same host-bridge pattern</text>
</svg>
